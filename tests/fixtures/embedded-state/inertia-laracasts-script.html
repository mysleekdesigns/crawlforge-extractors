reatorSeries":0,"isScheduled":false,"dates":{"launch":"2026-02-24T17:47:06.000000Z","launchForHumans":"February 24, 2026","lastUpdated":"Feb 24, 2026"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/filament-5-in-depth\/episodes\/1","bookmark":"\/series\/filament-5-in-depth\/bookmark"}},{"id":257,"title":"Leveraging AI for Laravel Development","body":"<p>The web development world forever changed in December, 2025. This was the month when we realized just how powerful and useful LLMs had truly become. And there's no turning back.<\/p>\r\n<p>It's time to get on board! This train isn't stopping. Join me, as I get you up to speed in record time. Learn about <a href=\"https:\/\/www.jetbrains.com\/ai\/\" target=\"_blank\">Jetbrains AI<\/a>, agents, prompting, vibe coding, developer-driven AI, Ralph Wiggum, and a wealth of tips and techniques to drastically <strong>speed up your workflow<\/strong>. Let's go!<\/p>\r\n","path":"\/series\/leveraging-ai-for-laravel-development","strippedBody":"The web development world forever changed in December, 2025. This was the month when we realized just how powerful and useful LLMs had truly become. And there's no turning back.\r\nIt's time to get on board! This train isn't stopping. Join me, as I get you up to speed in record time. Learn about Jetbrains AI, agents, prompting, vibe coding, developer-driven AI, Ralph Wiggum, and a wealth of tips and techniques to drastically speed up your workflow. Let's go!\r\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/leveraging-ai-for-laravel-development-thumbnail.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/open-graph-cards\/leveraging-ai-for-laravel-development-open-graph.png","trailer":"https:\/\/laracasts.nyc3.digitaloceanspaces.com\/series\/trailers\/leveraging-ai-for-laravel-development-trailer.mp4","slug":"leveraging-ai-for-laravel-development","episodeCount":18,"difficultyLevel":"Intermediate","complete":1,"runTime":"2h 45m","taxonomy":{"name":"AI","path":"https:\/\/laracasts.com\/browse\/ai"},"author":{"id":1770,"avatar":"https:\/\/images.laracasts.com\/instructors\/1770.jpeg?tr=w-50,h-50,q-60,fo-top","username":"JeffreyWay","profile":{"full_name":"Jeffrey Way"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2026-01-15T15:05:00.000000Z","launchForHumans":"January 15, 2026","lastUpdated":"Jan 15, 2026"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/leveraging-ai-for-laravel-development\/episodes\/1","bookmark":"\/series\/leveraging-ai-for-laravel-development\/bookmark"}},{"id":266,"title":"So You Want to Build an Agent","body":"You're likely using an AI agent every day at this point, but do you truly understand how it works under the hood? What separates an agent from a general chat? What's a tool? How do we provide the loop for executing these tools? In this series, we'll demystify some of these concepts by building a basic agent that is capable of interacting with your file system and triggering tools.\r\n","path":"\/series\/so-you-want-to-build-an-agent","strippedBody":"You're likely using an AI agent every day at this point, but do you truly understand how it works under the hood? What separates an agent from a general chat? What's a tool? How do we provide the loop for executing these tools? In this series, we'll demystify some of these concepts by building a basic agent that is capable of interacting with your file system and triggering tools.\r\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/so-you-want-to-build-an-agent-thumbnail.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/open-graph-cards\/so-you-want-to-build-an-agent-open-graph.png","slug":"so-you-want-to-build-an-agent","episodeCount":10,"difficultyLevel":"Intermediate","complete":1,"runTime":"2h 10m","taxonomy":{"name":"AI","path":"https:\/\/laracasts.com\/browse\/ai"},"author":{"id":1770,"avatar":"https:\/\/images.laracasts.com\/instructors\/1770.jpeg?tr=w-50,h-50,q-60,fo-top","username":"JeffreyWay","profile":{"full_name":"Jeffrey Way"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2026-04-16T16:06:56.000000Z","launchForHumans":"April 16, 2026","lastUpdated":"Apr 16, 2026"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/so-you-want-to-build-an-agent\/episodes\/1","bookmark":"\/series\/so-you-want-to-build-an-agent\/bookmark"}},{"id":258,"title":"Build Native Apps With PHP","body":"<p>Welcome to my CreatorSeries! I’m Simon, and in this series we’re going to learn about <a href=\"https:\/\/nativephp.com\/\">NativePHP<\/a> and use it to build true native applications for desktop and mobile. We're not talking about web apps accessed through the browser. Your users will be able to install directly on their devices.<\/p>\r\n<p>This is a big leap forward for the PHP ecosystem, and while it’s a real paradigm shift from the way we normally build with PHP and Laravel, we’ve worked hard to keep it familiar and approachable. So grab a warm drink, get comfortable, and let's start building!<\/p>\r\n","path":"\/series\/build-native-apps-with-php","strippedBody":"Welcome to my CreatorSeries! I’m Simon, and in this series we’re going to learn about NativePHP and use it to build true native applications for desktop and mobile. We're not talking about web apps accessed through the browser. Your users will be able to install directly on their devices.\r\nThis is a big leap forward for the PHP ecosystem, and while it’s a real paradigm shift from the way we normally build with PHP and Laravel, we’ve worked hard to keep it familiar and approachable. So grab a warm drink, get comfortable, and let's start building!\r\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/nativephp-thumbnail.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/open-graph-cards\/nativephp-open-graph.jpeg","trailer":"https:\/\/laracasts.nyc3.digitaloceanspaces.com\/series\/trailers\/native-php-trailer.mp4","slug":"build-native-apps-with-php","episodeCount":17,"difficultyLevel":"Intermediate","complete":0,"runTime":"2h 30m","taxonomy":{"name":"Frameworks","path":"https:\/\/laracasts.com\/browse\/frameworks"},"author":{"id":17877,"avatar":"https:\/\/images.laracasts.com\/instructors\/17877.jpeg?tr=w-50,h-50,q-60,fo-top","username":"simonhamp","profile":{"full_name":"Simon Hamp"}},"isCreatorSeries":1,"isScheduled":false,"dates":{"launch":"2026-01-31T22:06:25.000000Z","launchForHumans":"January 31, 2026","lastUpdated":"Jan 31, 2026"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/build-native-apps-with-php\/episodes\/1","bookmark":"\/series\/build-native-apps-with-php\/bookmark"}},{"id":245,"title":"BaseCode Reloaded","body":"<p>Years and years of hard-fought coding breakthroughs, distilled into sixteen essential lessons.<\/p><p>In this course, I'll show you how to write code for humans, not just machines. Together, we’ll review powerful techniques, like naming, structuring, removing clutter, and spotting patterns. These aren’t abstract theories from a dusty book. They’re practical and proven habits that you can apply to your codebase right now. If you’ve ever opened an old file and struggled to understand your own code, this course was made just for you.<\/p>\r\n","path":"\/series\/basecode-reloaded","strippedBody":"Years and years of hard-fought coding breakthroughs, distilled into sixteen essential lessons.In this course, I'll show you how to write code for humans, not just machines. Together, we’ll review powerful techniques, like naming, structuring, removing clutter, and spotting patterns. These aren’t abstract theories from a dusty book. They’re practical and proven habits that you can apply to your codebase right now. If you’ve ever opened an old file and struggled to understand your own code, this course was made just for you.\r\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/basecode-reloaded.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/open-graph-cards\/basecode-reloaded-og.jpg","slug":"basecode-reloaded","episodeCount":16,"difficultyLevel":"Intermediate","complete":1,"runTime":"1h 58m","taxonomy":{"name":"Techniques","path":"https:\/\/laracasts.com\/browse\/techniques"},"author":{"id":34923,"avatar":"https:\/\/images.laracasts.com\/instructors\/34923.jpeg?tr=w-50,h-50,q-60,fo-top","username":"jason-mccreary","profile":{"full_name":"Jason McCreary"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2025-09-03T16:00:00.000000Z","launchForHumans":"September 3, 2025","lastUpdated":"Sep 3, 2025"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/basecode-reloaded\/episodes\/1","bookmark":"\/series\/basecode-reloaded\/bookmark"}},{"id":247,"title":"The Laravel Workshop","body":"<p>Buckle up, this is the workshop you've been waiting for! In fact, this course is such a massive undertaking to the point that it required three Laracasts instructors. Join Jeffrey Way, Simon Vrachliotis, and Jeremy McPeak as we build a fictional X-like platform, called Pixl, entirely from scratch!<\/p><p>Each instructor is responsible for one piece of the puzzle. Simon will tackle the static HTML and CSS build. Then Jeremy will convert it into a traditional and dynamic Laravel application. Finally, Jeffrey will demonstrate how to transform a server-side app into a full SPA. Let's go!<\/p>\r\n","path":"\/series\/the-laravel-workshop","strippedBody":"Buckle up, this is the workshop you've been waiting for! In fact, this course is such a massive undertaking to the point that it required three Laracasts instructors. Join Jeffrey Way, Simon Vrachliotis, and Jeremy McPeak as we build a fictional X-like platform, called Pixl, entirely from scratch!Each instructor is responsible for one piece of the puzzle. Simon will tackle the static HTML and CSS build. Then Jeremy will convert it into a traditional and dynamic Laravel application. Finally, Jeffrey will demonstrate how to transform a server-side app into a full SPA. Let's go!\r\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/laravel-workshop.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/open-graph\/laravel-workshop-og.png","trailer":"https:\/\/laracasts.nyc3.digitaloceanspaces.com\/series\/trailers\/Laravel-Workshop-trailer.mp4","slug":"the-laravel-workshop","episodeCount":64,"difficultyLevel":"Intermediate","complete":1,"runTime":"12h 36m","taxonomy":{"name":"Frameworks","path":"https:\/\/laracasts.com\/browse\/frameworks"},"author":{"id":435798,"avatar":"https:\/\/images.laracasts.com\/instructors\/435798.jpeg?tr=w-50,h-50,q-60,fo-top","username":"laracastsinstructors","profile":{"full_name":"Instructor Team"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2025-11-28T15:20:18.000000Z","launchForHumans":"November 28, 2025","lastUpdated":"Nov 28, 2025"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/the-laravel-workshop\/episodes\/1","bookmark":"\/series\/the-laravel-workshop\/bookmark"}},{"id":263,"title":"Watch Me AI the UI","body":"<p>In this workshop, come along as I upgrade the visual design of our Laracasts team dashboard. As you'll see, design work can sometimes be a bit tricky to orchestrate. Can AI properly evaluate a screenshot and convert it to CSS? Well, yes...and no! But luckily, we have a variety of techniques we can use to increase our odds of success. Let's go!<\/p>\r\n","path":"\/series\/watch-me-ai-the-front-end","strippedBody":"In this workshop, come along as I upgrade the visual design of our Laracasts team dashboard. As you'll see, design work can sometimes be a bit tricky to orchestrate. Can AI properly evaluate a screenshot and convert it to CSS? Well, yes...and no! But luckily, we have a variety of techniques we can use to increase our odds of success. Let's go!\r\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/watch-me-ai-the-front-end-thumbnail.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/open-graph-cards\/watch-me-ai-the-front-end-open-graph.png","slug":"watch-me-ai-the-front-end","episodeCount":5,"difficultyLevel":"Intermediate","complete":1,"runTime":"47m","taxonomy":{"name":"AI","path":"https:\/\/laracasts.com\/browse\/ai"},"author":{"id":1770,"avatar":"https:\/\/images.laracasts.com\/instructors\/1770.jpeg?tr=w-50,h-50,q-60,fo-top","username":"JeffreyWay","profile":{"full_name":"Jeffrey Way"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2026-03-11T15:26:12.000000Z","launchForHumans":"March 11, 2026","lastUpdated":"Mar 11, 2026"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/watch-me-ai-the-front-end\/episodes\/1","bookmark":"\/series\/watch-me-ai-the-front-end\/bookmark"}},{"id":267,"title":"Blaze Deep-Dive","body":"<p>Blade components are slow. Really slow. At scale, they quietly become the biggest bottleneck in your Laravel application. We discovered this while trying to make <a href=\"https:\/\/fluxui.dev\">Flux<\/a> as fast as possible, and the result is <a href=\"https:\/\/blazephp.dev\">Blaze<\/a>: a package that fundamentally rethinks how Blade components are compiled and rendered. With multiple levels of optimization, Blaze can shave hundreds of milliseconds off a page load, making Blade rendering up to 25x faster in some cases.<\/p><p>In this series, we'll install it, benchmark it, build a toy version from scratch so you truly understand how it works, and then master every directive and edge case so you can squeeze maximum performance out of your own apps.<\/p>\r\n","path":"\/series\/blaze-deep-dive","strippedBody":"Blade components are slow. Really slow. At scale, they quietly become the biggest bottleneck in your Laravel application. We discovered this while trying to make Flux as fast as possible, and the result is Blaze: a package that fundamentally rethinks how Blade components are compiled and rendered. With multiple levels of optimization, Blaze can shave hundreds of milliseconds off a page load, making Blade rendering up to 25x faster in some cases.In this series, we'll install it, benchmark it, build a toy version from scratch so you truly understand how it works, and then master every directive and edge case so you can squeeze maximum performance out of your own apps.\r\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/blaze-creatorseries-thumbnail.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/open-graph-cards\/blaze-creatorseries-open-graph.png","trailer":"https:\/\/laracasts.nyc3.digitaloceanspaces.com\/series\/trailers\/blaze-creator-series-trailer.mp4","slug":"blaze-deep-dive","episodeCount":20,"difficultyLevel":"Advanced","complete":0,"runTime":"2h 13m","taxonomy":{"name":"Frameworks","path":"https:\/\/laracasts.com\/browse\/frameworks"},"author":{"id":7952,"avatar":"https:\/\/images.laracasts.com\/instructors\/7952.jpeg?tr=w-50,h-50,q-60,fo-top","username":"calebporzio","profile":{"full_name":"Caleb Porzio"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2026-04-23T13:00:00.000000Z","launchForHumans":"April 23, 2026","lastUpdated":"Apr 23, 2026"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/blaze-deep-dive\/episodes\/1","bookmark":"\/series\/blaze-deep-dive\/bookmark"}},{"id":270,"title":"Practical UI Components With Livewire and Alpine","body":"<p>In this series, we'll build a collection of practical UI components with <code>Livewire<\/code> and <code>AlpineJS<\/code>, using real interface patterns instead of toy examples. We'll start with smaller pieces like inline editing and a reusable <code>toast<\/code> system, then move into more stateful components like multi-step flows, tag inputs, dynamic search, notifications, and a drag-and-drop Kanban board.<\/p>\r\n<p>Along the way, we'll focus on the details that make UI feel great to use: autosave, subtle feedback, keyboard navigation, transitions, persisted state, polling, and clean reset behavior. By the end, you'll have a small library of polished components and a clearer sense of how to structure these kinds of interfaces with <code>Livewire<\/code> and <code>Alpine<\/code> in your own apps.<\/p>\r\n","path":"\/series\/practical-ui-components-with-livewire-and-alpinejs","strippedBody":"In this series, we'll build a collection of practical UI components with Livewire and AlpineJS, using real interface patterns instead of toy examples. We'll start with smaller pieces like inline editing and a reusable toast system, then move into more stateful components like multi-step flows, tag inputs, dynamic search, notifications, and a drag-and-drop Kanban board.\r\nAlong the way, we'll focus on the details that make UI feel great to use: autosave, subtle feedback, keyboard navigation, transitions, persisted state, polling, and clean reset behavior. By the end, you'll have a small library of polished components and a clearer sense of how to structure these kinds of interfaces with Livewire and Alpine in your own apps.\r\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/practical-ui-components-recordings-thumbnail.png","large_thumbnail":"https:\/\/laracasts.s3.amazonaws.com\/series\/thumbnails\/social-cards\/practical-ui-components-with-livewire-and-alpinejs.png","slug":"practical-ui-components-with-livewire-and-alpinejs","episodeCount":9,"difficultyLevel":"Intermediate","complete":0,"runTime":"1h 55m","taxonomy":{"name":"Frameworks","path":"https:\/\/laracasts.com\/browse\/frameworks"},"author":{"id":242506,"avatar":"https:\/\/images.laracasts.com\/instructors\/242506.jpeg?tr=w-50,h-50,q-60,fo-top","username":"ShrutiBalasa","profile":{"full_name":"Shruti Balasa"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2026-07-22T15:19:25.000000Z","launchForHumans":"July 22, 2026","lastUpdated":"Jul 22, 2026"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/practical-ui-components-with-livewire-and-alpinejs\/episodes\/1","bookmark":"\/series\/practical-ui-components-with-livewire-and-alpinejs\/bookmark"}},{"id":248,"title":"How to Build a Dev Team","body":"<P>Resources for learning to code are everywhere. The only hard part is choosing one. But when it comes to learning how to lead a development team, quality resources are incredibly scarce.<\/p>\r\n\r\n<p>This course fills that gap. It contains all of the lessons I learned while building the dev team at <a href=\"https:\/\/tighten.com\/\" target=\"_blank\" class=\"text-current-taxonomy!\">Tighten<\/a>, a Laravel consultancy known for producing great work, but with an even better reputation as a fantastic place to work.<\/p>","path":"\/series\/how-to-build-a-dev-team","strippedBody":"Resources for learning to code are everywhere. The only hard part is choosing one. But when it comes to learning how to lead a development team, quality resources are incredibly scarce.\r\n\r\nThis course fills that gap. It contains all of the lessons I learned while building the dev team at Tighten, a Laravel consultancy known for producing great work, but with an even better reputation as a fantastic place to work.","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/how-i-built-tighten.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/open-graph-cards\/how-i-built-tighten.png","trailer":"https:\/\/laracasts.nyc3.digitaloceanspaces.com\/series\/trailers\/how-to-build-a-dev-team-trailer.mp4","slug":"how-to-build-a-dev-team","episodeCount":12,"difficultyLevel":"Intermediate","complete":1,"runTime":"2h 50m","taxonomy":{"name":"Techniques","path":"https:\/\/laracasts.com\/browse\/techniques"},"author":{"id":22175,"avatar":"https:\/\/images.laracasts.com\/instructors\/22175.jpeg?tr=w-50,h-50,q-60,fo-top","username":"mattstauffer","profile":{"full_name":"Matt Stauffer"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2025-10-11T14:00:00.000000Z","launchForHumans":"October 11, 2025","lastUpdated":"Oct 11, 2025"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/how-to-build-a-dev-team\/episodes\/1","bookmark":"\/series\/how-to-build-a-dev-team\/bookmark"}},{"id":271,"title":"Practical Progressive Web Apps","body":"<p>In this series, we'll turn a Laravel app into a practical <code>progressive web app<\/code> for people working in the field, where unreliable connectivity is just part of the job. We'll cover the core PWA pieces like the <code>manifest<\/code> and a root-level <code>service worker<\/code>, then build real offline support with dynamic manifests, smart caching strategies, placeholder fallbacks, and clear UI feedback around network status.<\/p>\n<p>We'll also add push notifications from end to end and move beyond &quot;read-only offline&quot; by building a true offline workflow for form submissions using <code>IndexedDB<\/code>, background <code>sync<\/code>, and a dedicated <code>Sanctum<\/code> token. By the end, you'll have a Laravel app that feels installable, resilient, and dependable in the real world.<\/p>\n","path":"\/series\/practical-progressive-web-apps","strippedBody":"In this series, we'll turn a Laravel app into a practical progressive web app for people working in the field, where unreliable connectivity is just part of the job. We'll cover the core PWA pieces like the manifest and a root-level service worker, then build real offline support with dynamic manifests, smart caching strategies, placeholder fallbacks, and clear UI feedback around network status.\nWe'll also add push notifications from end to end and move beyond &quot;read-only offline&quot; by building a true offline workflow for form submissions using IndexedDB, background sync, and a dedicated Sanctum token. By the end, you'll have a Laravel app that feels installable, resilient, and dependable in the real world.\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/progressive-web-apps-thumbnail.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/open-graph-cards\/progressive-web-apps-open-graph.png","slug":"practical-progressive-web-apps","episodeCount":20,"difficultyLevel":"Intermediate","complete":0,"runTime":"5h 2m","taxonomy":{"name":"Techniques","path":"https:\/\/laracasts.com\/browse\/techniques"},"author":{"id":24345,"avatar":"https:\/\/images.laracasts.com\/instructors\/24345.jpeg?tr=w-50,h-50,q-60,fo-top","username":"jwmcpeak","profile":{"full_name":"Jeremy McPeak"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2026-08-18T09:00:00.000000Z","launchForHumans":"August 18, 2026","lastUpdated":"Aug 18, 2026"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/practical-progressive-web-apps\/episodes\/1","bookmark":"\/series\/practical-progressive-web-apps\/bookmark"}},{"id":259,"title":"AI Developer Workflows","body":"<p>It's a brand new world. Suddenly, we find ourselves less writing code line by line, and more writing plans, coordinating agents, and building workflows. There's a lot to learn. But we gotcha!<\/p><p>In this series, each episode will demonstrate one potential AI workflow that you might adopt in your own projects. Check back often, as we'll be adding new episodes every month.<\/p>\r\n","path":"\/series\/ai-developer-workflows","strippedBody":"It's a brand new world. Suddenly, we find ourselves less writing code line by line, and more writing plans, coordinating agents, and building workflows. There's a lot to learn. But we gotcha!In this series, each episode will demonstrate one potential AI workflow that you might adopt in your own projects. Check back often, as we'll be adding new episodes every month.\r\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/ai-developer-workflows-thumbnail.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/open-graph-cards\/ai-developer-workflows.jpeg","slug":"ai-developer-workflows","episodeCount":3,"difficultyLevel":"Intermediate","complete":0,"runTime":"47m","taxonomy":{"name":"AI","path":"https:\/\/laracasts.com\/browse\/ai"},"author":{"id":1770,"avatar":"https:\/\/images.laracasts.com\/instructors\/1770.jpeg?tr=w-50,h-50,q-60,fo-top","username":"JeffreyWay","profile":{"full_name":"Jeffrey Way"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2026-02-02T14:00:00.000000Z","launchForHumans":"February 2, 2026","lastUpdated":"Feb 2, 2026"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/ai-developer-workflows\/episodes\/1","bookmark":"\/series\/ai-developer-workflows\/bookmark"}},{"id":249,"title":"The TALL Developer","body":"<p>In this course, you'll learn how to build full-stack web applications using the TALL stack — Tailwind CSS, Alpine.js, Laravel, and Livewire. These four tools work incredibly well together and will help you construct modern, interactive websites without writing too much JavaScript. To illustrate these tools, let's build a simple, yet fully functional job board application using the TALL stack.<\/p>\r\n","path":"\/series\/the-tall-developer","strippedBody":"In this course, you'll learn how to build full-stack web applications using the TALL stack — Tailwind CSS, Alpine.js, Laravel, and Livewire. These four tools work incredibly well together and will help you construct modern, interactive websites without writing too much JavaScript. To illustrate these tools, let's build a simple, yet fully functional job board application using the TALL stack.\r\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/the-tall-developer.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/open-graph-cards\/the-tall-developer.png","slug":"the-tall-developer","episodeCount":16,"difficultyLevel":"Beginner","complete":1,"runTime":"2h 53m","taxonomy":{"name":"Frameworks","path":"https:\/\/laracasts.com\/browse\/frameworks"},"author":{"id":242506,"avatar":"https:\/\/images.laracasts.com\/instructors\/242506.jpeg?tr=w-50,h-50,q-60,fo-top","username":"ShrutiBalasa","profile":{"full_name":"Shruti Balasa"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2025-11-25T15:00:00.000000Z","launchForHumans":"November 25, 2025","lastUpdated":"Nov 25, 2025"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/the-tall-developer\/episodes\/1","bookmark":"\/series\/the-tall-developer\/bookmark"}},{"id":241,"title":"Running Clock","body":"<p>Welcome to \"Running Clock,\" my new interview series where I fire off questions to top developers about their favorite tools, frameworks, and coding obsessions. The catch? We only have five minutes to get through all of my questions...and the clock is ticking!<\/p>\r\n","path":"\/series\/running-clock","strippedBody":"Welcome to \"Running Clock,\" my new interview series where I fire off questions to top developers about their favorite tools, frameworks, and coding obsessions. The catch? We only have five minutes to get through all of my questions...and the clock is ticking!\r\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/running-clock.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/open-graph-cards\/running-clock-generic-series.jpg","slug":"running-clock","episodeCount":11,"difficultyLevel":"Beginner","complete":0,"runTime":"1h 3m","taxonomy":{"name":"Tooling","path":"https:\/\/laracasts.com\/browse\/tooling"},"author":{"id":80737,"avatar":"https:\/\/images.laracasts.com\/instructors\/80737.jpeg?tr=w-50,h-50,q-60,fo-top","username":"simonswiss","profile":{"full_name":"Simon Vrachliotis"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2025-06-30T13:27:04.000000Z","launchForHumans":"June 30, 2025","lastUpdated":"Jun 30, 2025"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/running-clock\/episodes\/1","bookmark":"\/series\/running-clock\/bookmark"}},{"id":246,"title":"React, The Laravel Way","body":"<p>In &quot;<a href=\"https:\/\/laracasts.com\/series\/react-from-scratch\">React from Scratch<\/a>&quot;, we built a &quot;DevPups&quot; app from scratch. Now it's time to take things further. Using that finished app as a base, you'll learn how to construct a React-powered app...the Laravel way!<p>\r\nYou'll see how we can swap out fragile external API calls for Laravel's elegant backend, add real-time &quot;like&quot; functionality, support file uploads, and polish up our CRUD features with proper authorization. Along the way, you'll get comfortable with Inertia.js, the perfect glue between Laravel's backend strength and React's frontend flexibility.<\/p>\r\n<p>By the end of this series, you'll have constructed a production-ready app that shows the Laravel way of working with React: fewer moving parts, cleaner architecture, and faster development.<\/p>\r\n","path":"\/series\/react-the-laravel-way","strippedBody":"In &quot;React from Scratch&quot;, we built a &quot;DevPups&quot; app from scratch. Now it's time to take things further. Using that finished app as a base, you'll learn how to construct a React-powered app...the Laravel way!\r\nYou'll see how we can swap out fragile external API calls for Laravel's elegant backend, add real-time &quot;like&quot; functionality, support file uploads, and polish up our CRUD features with proper authorization. Along the way, you'll get comfortable with Inertia.js, the perfect glue between Laravel's backend strength and React's frontend flexibility.\r\nBy the end of this series, you'll have constructed a production-ready app that shows the Laravel way of working with React: fewer moving parts, cleaner architecture, and faster development.\r\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/react-the-laravel-way.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/open-graph-cards\/react-the-laravel-way.png","slug":"react-the-laravel-way","episodeCount":30,"difficultyLevel":"Intermediate","complete":1,"runTime":"6h 25m","taxonomy":{"name":"Frameworks","path":"https:\/\/laracasts.com\/browse\/frameworks"},"author":{"id":80737,"avatar":"https:\/\/images.laracasts.com\/instructors\/80737.jpeg?tr=w-50,h-50,q-60,fo-top","username":"simonswiss","profile":{"full_name":"Simon Vrachliotis"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2025-09-17T14:00:00.000000Z","launchForHumans":"September 17, 2025","lastUpdated":"Sep 17, 2025"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/react-the-laravel-way\/episodes\/1","bookmark":"\/series\/react-the-laravel-way\/bookmark"}},{"id":260,"title":"Debugging Real-World Production Nightmares","body":"<p>Production bugs don't announce themselves politely. In this series, we confront ten nightmare scenarios using NightmareMart, an intentionally broken e-commerce app, demonstrating how to debug calmly and methodically when everything is on fire.<\/p>\r\n","path":"\/series\/debugging-real-world-production-nightmares","strippedBody":"Production bugs don't announce themselves politely. In this series, we confront ten nightmare scenarios using NightmareMart, an intentionally broken e-commerce app, demonstrating how to debug calmly and methodically when everything is on fire.\r\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/debugging-real-world-production-nightmares.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/open-graph-cards\/debugging-real-world-production-nightmares.png","slug":"debugging-real-world-production-nightmares","episodeCount":10,"difficultyLevel":"Advanced","complete":0,"runTime":"1h 49m","taxonomy":{"name":"Techniques","path":"https:\/\/laracasts.com\/browse\/techniques"},"author":{"id":24345,"avatar":"https:\/\/images.laracasts.com\/instructors\/24345.jpeg?tr=w-50,h-50,q-60,fo-top","username":"jwmcpeak","profile":{"full_name":"Jeremy McPeak"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2026-02-11T17:07:56.000000Z","launchForHumans":"February 11, 2026","lastUpdated":"Feb 11, 2026"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/debugging-real-world-production-nightmares\/episodes\/1","bookmark":"\/series\/debugging-real-world-production-nightmares\/bookmark"}},{"id":242,"title":"Defensive Laravel","body":"<p>In this series, we'll take a deep-dive into various strategies and tools that will help you write robust and reliable code. We'll explore core defensive programming concepts, from strict typing and immutable objects to leveraging value objects for more effective domain modeling. Okay, let's dig in!<\/p>\n","path":"\/series\/defensive-laravel","strippedBody":"In this series, we'll take a deep-dive into various strategies and tools that will help you write robust and reliable code. We'll explore core defensive programming concepts, from strict typing and immutable objects to leveraging value objects for more effective domain modeling. Okay, let's dig in!\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/defensive-laravel.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/open-graph-cards\/defensive-laravel.png","slug":"defensive-laravel","episodeCount":18,"difficultyLevel":"Advanced","complete":1,"runTime":"3h 7m","taxonomy":{"name":"Frameworks","path":"https:\/\/laracasts.com\/browse\/frameworks"},"author":{"id":21268,"avatar":"https:\/\/images.laracasts.com\/instructors\/21268.jpeg?tr=w-50,h-50,q-60,fo-top","username":"mateusjatenee","profile":{"full_name":"Mateus Guimarães"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2025-07-28T18:00:18.000000Z","launchForHumans":"July 28, 2025","lastUpdated":"Jul 28, 2025"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/defensive-laravel\/episodes\/1","bookmark":"\/series\/defensive-laravel\/bookmark"}},{"id":255,"title":"Everything New in Livewire 4","body":"<p><a href=\"https:\/\/livewire.laravel.com\/\" target=\"_blank\">Livewire 4<\/a> is a major release, and it's packed with features you're going to love. View-based components keep your PHP and Blade together in one file. Islands let you create isolated, independently-updating regions without the overhead of nested components. New directives like <code class=\"p-0 text-base\">wire:sort<\/code> tackle big things with minimal code. And a powerful JavaScript interceptor system gives you fine-grained control over every request.<\/p><p>Whether you're upgrading an existing app or starting fresh, this series will walk you through everything new, from the fundamentals to the advanced stuff. Let's dig in.<\/p>\r\n","path":"\/series\/everything-new-in-livewire-4","strippedBody":"Livewire 4 is a major release, and it's packed with features you're going to love. View-based components keep your PHP and Blade together in one file. Islands let you create isolated, independently-updating regions without the overhead of nested components. New directives like wire:sort tackle big things with minimal code. And a powerful JavaScript interceptor system gives you fine-grained control over every request.Whether you're upgrading an existing app or starting fresh, this series will walk you through everything new, from the fundamentals to the advanced stuff. Let's dig in.\r\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/everything-new-in-livewire-4-thumbnail.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/open-graph-cards\/everything-new-in-livewire-4-open-graph.jpg","slug":"everything-new-in-livewire-4","episodeCount":25,"difficultyLevel":"Intermediate","complete":1,"runTime":"2h 35m","taxonomy":{"name":"Frameworks","path":"https:\/\/laracasts.com\/browse\/frameworks"},"author":{"id":7952,"avatar":"https:\/\/images.laracasts.com\/instructors\/7952.jpeg?tr=w-50,h-50,q-60,fo-top","username":"calebporzio","profile":{"full_name":"Caleb Porzio"}},"isCreatorSeries":1,"isScheduled":false,"dates":{"launch":"2026-01-14T14:00:00.000000Z","launchForHumans":"January 14, 2026","lastUpdated":"Jan 14, 2026"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/everything-new-in-livewire-4\/episodes\/1","bookmark":"\/series\/everything-new-in-livewire-4\/bookmark"}},{"id":251,"title":"Learn Laravel Forge","body":"<p>In this series, long-time Laravel Forge advocate Matt Stauffer will teach you how to become a Forge power user. Of course, you'll learn how to provision servers in seconds, but you'll also learn about zero-downtime deployments, processes, queues, securing sites with SSL, database backups, networks, and more!<\/p><p>Each episode is bite-sized, so feel free to jump around to the topic that interests you most. Let's go!<\/p>\r\n","path":"\/series\/laravel-forge","strippedBody":"In this series, long-time Laravel Forge advocate Matt Stauffer will teach you how to become a Forge power user. Of course, you'll learn how to provision servers in seconds, but you'll also learn about zero-downtime deployments, processes, queues, securing sites with SSL, database backups, networks, and more!Each episode is bite-sized, so feel free to jump around to the topic that interests you most. Let's go!\r\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/laravel-forge.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/open-graph-cards\/learn-laravel-forge.png","slug":"laravel-forge","episodeCount":23,"difficultyLevel":"Intermediate","complete":1,"runTime":"1h 58m","taxonomy":{"name":"Tooling","path":"https:\/\/laracasts.com\/browse\/tooling"},"author":{"id":22175,"avatar":"https:\/\/images.laracasts.com\/instructors\/22175.jpeg?tr=w-50,h-50,q-60,fo-top","username":"mattstauffer","profile":{"full_name":"Matt Stauffer"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2025-11-25T16:00:00.000000Z","launchForHumans":"November 25, 2025","lastUpdated":"Nov 25, 2025"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/laravel-forge\/episodes\/1","bookmark":"\/series\/laravel-forge\/bookmark"}},{"id":250,"title":"Eloquent Relationships Deep Dive","body":"<p>In this series, we'll unlock the full power of Eloquent relationships, from the basics of <code>hasOne<\/code> and <code>belongsToMany<\/code> to polymorphic magic and performance tuning. Whether you're building a blog or architecting a multi-tenant SaaS, understanding how your models connect is critical. Let's get relational.<\/p>\r\n","path":"\/series\/eloquent-relationships-deep-dive","strippedBody":"In this series, we'll unlock the full power of Eloquent relationships, from the basics of hasOne and belongsToMany to polymorphic magic and performance tuning. Whether you're building a blog or architecting a multi-tenant SaaS, understanding how your models connect is critical. Let's get relational.\r\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/eloquent-relationships-deep-dive.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/open-graph-cards\/eloquent-relationships-deep-dive.jpeg","slug":"eloquent-relationships-deep-dive","episodeCount":8,"difficultyLevel":"Intermediate","complete":1,"runTime":"2h 11m","taxonomy":{"name":"Frameworks","path":"https:\/\/laracasts.com\/browse\/frameworks"},"author":{"id":24345,"avatar":"https:\/\/images.laracasts.com\/instructors\/24345.jpeg?tr=w-50,h-50,q-60,fo-top","username":"jwmcpeak","profile":{"full_name":"Jeremy McPeak"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2025-11-26T15:00:00.000000Z","launchForHumans":"November 26, 2025","lastUpdated":"Nov 26, 2025"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/eloquent-relationships-deep-dive\/episodes\/1","bookmark":"\/series\/eloquent-relationships-deep-dive\/bookmark"}},{"id":265,"title":"Frontend Mentor Challenge with Laravel","body":"<p>In this series, we take a Frontend Mentor challenge and build it using Laravel and Tailwind CSS. Rather than chasing pixel-perfect replication, the focus is on pragmatic Laravel and backend logic. Along the way, we explore carts, session state, semantic markup, and UI polish.<\/p>\n","path":"\/series\/frontend-mentor-challenge-with-laravel","strippedBody":"In this series, we take a Frontend Mentor challenge and build it using Laravel and Tailwind CSS. Rather than chasing pixel-perfect replication, the focus is on pragmatic Laravel and backend logic. Along the way, we explore carts, session state, semantic markup, and UI polish.\n","thumbnail":"https:\/\/images.laracasts.com\/series\/thumbnails\/png\/frontend-mentor-challenge-thumbnail.png","large_thumbnail":"https:\/\/images.laracasts.com\/series\/open-graph-cards\/frontend-mentor-challenge-open-graph.png","slug":"frontend-mentor-challenge-with-laravel","episodeCount":27,"difficultyLevel":"Intermediate","complete":0,"runTime":"3h 24m","taxonomy":{"name":"Techniques","path":"https:\/\/laracasts.com\/browse\/techniques"},"author":{"id":80737,"avatar":"https:\/\/images.laracasts.com\/instructors\/80737.jpeg?tr=w-50,h-50,q-60,fo-top","username":"simonswiss","profile":{"full_name":"Simon Vrachliotis"}},"isCreatorSeries":0,"isScheduled":false,"dates":{"launch":"2026-04-03T15:13:16.000000Z","launchForHumans":"April 3, 2026","lastUpdated":"Apr 3, 2026"},"progress":{"started":false,"completionPercentage":0,"episodesCompleted":0,"completed":false,"nextEpisodePosition":1},"links":{"continue":"\/series\/frontend-mentor-challenge-with-laravel\/episodes\/1","bookmark":"\/series\/frontend-mentor-challenge-with-laravel\/bookmark"}},{"id":254,"title":"Laravel From Scratch (2026 Edition)","body":"<p>Welcome to the latest iteration of the longest running Laravel introductory video series in the world. Like clockwork, we refresh this series every two years. This latest <strong>2026 iteration covers Laravel 12<\/strong> and beyond.<\/p>\r\n<p>You'll learn not only the basic fundamentals of Laravel, but also how to leverage more advanced features like authentication, authorization, queues, testing, and more. We'll even review the full deployment process from scratch.<\/p>\r\n","path":"\/series\/laravel-from-scratch-2026","strippedBody":"Welcome to the latest iteration of the longest running Laravel introductory video series in the world. Like clockwork, we refresh this series every two years. This latest 2026 iteration covers Laravel 12 and beyond.\r\nYou'll learn not only the basic fundamentals of Laravel, but also how to leve  You learn to just except his infinite awesomeness, because it just hurts your head to think about it too much!","link":"http:\/\/dustinwoodard.net","featured":0},{"id":106,"name":"Nicolás Múnera","avatar":"https:\/\/images.laracasts.com\/reviews\/nicolas-munera.jpg","job":null,"body":"I've always preferred learning programming languages with online courses and videos. Well, let me tell you: from all videos I've seen, to all the University classes I've taken, I've never seen a better instructor than Jeffrey. You actually get attached to his screencasts like you would to a TV Show!","link":"https:\/\/github.com\/nicolasmuneram","featured":0}],"conversations":[{"id":224278,"views":972,"title":"How to test a controller ?","path":"https:\/\/laracasts.com\/discuss\/channels\/testing\/how-to-test-a-controller","excerpt":"Hello,\nI want to deepen my knowledge to write better tests.\nMy controllers look like this.\npublic function store(TypeRequest $request, TypeService $typeService)\n{\n    Gate::authorize('create', Type::class);\n\n    $typeService-&gt;store($request-&gt;validated());\n\n    Inertia::flash('message', 'Le type a été enregitré avec succès !');\n\n    return to_route('admin.types.index');\n}","body":"<p>Hello,<\/p>\n<p>I want to deepen my knowledge to write better tests.<\/p>\n<p>My controllers look like this.<\/p>\n<pre><code>public function store(TypeRequest $request, TypeService $typeService)\n{\n    Gate::authorize('create', Type::class);\n\n    $typeService-&gt;store($request-&gt;validated());\n\n    Inertia::flash('message', 'Le type a été enregitré avec succès !');\n\n    return to_route('admin.types.index');\n}\n<\/code><\/pre>\n<p>I'd like to test what the controller has to do.<\/p>\n<p>I have the idea to write my test like this.<\/p>\n<pre><code class=\"collapsed\">describe('store', function () {\n    test('authorized user can store a type', function () {\n        $user = createUserWithPermission('create type');\n\n        $type = [];\n\n        $this-&gt;mock(TypeRequest::class, function ($mock) use ($type) {\n            $mock-&gt;shouldReceive('validated')\n                -&gt;once()\n                -&gt;andReturn($type);\n        });\n\n        $this-&gt;mock(TypeService::class, function ($mock) use ($type) {\n            $mock-&gt;shouldReceive('store')-&gt;once()-&gt;with($type);\n        });\n\n        $this-&gt;actingAs($user, 'web')\n            -&gt;post(route('admin.types.store'), $type)\n            -&gt;assertRedirectToRoute('admin.types.index')\n            -&gt;assertInertiaFlash('message');\n    });\n\n    test('unauthorized user cannot store a type', function () {\n        $user = createUser();\n\n        $this-&gt;actingAs($user, 'web')\n            -&gt;get(route('admin.types.store'))\n            -&gt;assertForbidden();\n    });\n});\n<\/code><\/pre>\n<pre><code>test('it stores a type', function () {\n    $type = [\n        'name' =&gt; 'name',\n        'description' =&gt; 'description',\n        'is_only_for_partners' =&gt; false,\n    ];\n\n    (new TypeService)-&gt;store($type);\n\n    $this-&gt;assertDatabaseHas('types', $type);\n});\n<\/code><\/pre>\n<p>And I also test my form request.<\/p>\n<p>So my idea is to isolate the controller in the test, so that I test only what the controller has to do. And I test the injected dependencies separately.<\/p>\n<p>Is it a good idea ?<\/p>\n<p>How would write the test ? What would you suggest me ?<\/p>\n<p>Thanks for your help.<\/p>\n<p>V<\/p>\n","body_in_markdown":"Hello,\n\nI want to deepen my knowledge to write better tests.\n\nMy controllers look like this.\n\n```\npublic function store(TypeRequest $request, TypeService $typeService)\n{\n    Gate::authorize('create', Type::class);\n\n    $typeService->store($request->validated());\n\n    Inertia::flash('message', 'Le type a été enregitré avec succès !');\n\n    return to_route('admin.types.index');\n}\n```\n\nI'd like to test what the controller has to do.\n\nI have the idea to write my test like this.\n\n```\ndescribe('store', function () {\n    test('authorized user can store a type', function () {\n        $user = createUserWithPermission('create type');\n\n        $type = [];\n\n        $this->mock(TypeRequest::class, function ($mock) use ($type) {\n            $mock->shouldReceive('validated')\n                ->once()\n                ->andReturn($type);\n        });\n\n        $this->mock(TypeService::class, function ($mock) use ($type) {\n            $mock->shouldReceive('store')->once()->with($type);\n        });\n\n        $this->actingAs($user, 'web')\n            ->post(route('admin.types.store'), $type)\n            ->assertRedirectToRoute('admin.types.index')\n            ->assertInertiaFlash('message');\n    });\n\n    test('unauthorized user cannot store a type', function () {\n        $user = createUser();\n\n        $this->actingAs($user, 'web')\n            ->get(route('admin.types.store'))\n            ->assertForbidden();\n    });\n});\n```\n\n```\ntest('it stores a type', function () {\n    $type = [\n        'name' => 'name',\n        'description' => 'description',\n        'is_only_for_partners' => false,\n    ];\n\n    (new TypeService)->store($type);\n\n    $this->assertDatabaseHas('types', $type);\n});\n```\n\nAnd I also test my form request.\n\nSo my idea is to isolate the controller in the test, so that I test only what the controller has to do. And I test the injected dependencies separately.\n\nIs it a good idea ?\n\nHow would write the test ? What would you suggest me ?\n\nThanks for your help.\n\nV","slug":"how-to-test-a-controller","reply_count":7,"answered":true,"owner":{"id":179033,"username":"vincent15000","avatar":"https:\/\/unavatar.io\/x\/@VincentErhart","profile":{"full_name":"Vincent","bio":"I'm a software developer who loves to build things with Laravel.","twitter":"@VincentErhart","github":"","website":"","employment":"Freelance","job_title":"Web developer","location":"Aurillac","flag":"fr","available_for_h
